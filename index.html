<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Music Tool</title>
<meta name="description" content="Pocket music studio: piano and drums in your browser. Works offline." />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    background:#ffffff; color:#0f1e33; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 14px 20px; user-select:none; -webkit-user-select:none;
  }
  .wrap{ width:100%; max-width:560px; display:flex; flex-direction:column; gap:12px; }
  header{ display:flex; align-items:center; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand-name{ font-size:20px; font-weight:800; letter-spacing:.2px; }
  .vol{ display:flex; align-items:center; gap:6px; color:#64748b; font-size:12px; font-weight:700; }
  .vol input{ width:90px; accent-color:#6366f1; }
  .tabs{ display:flex; background:#eef2f7; border-radius:14px; padding:4px; gap:4px; }
  .tabs button{
    flex:1; border:none; background:transparent; color:#64748b;
    font-size:15px; font-weight:700; padding:11px; border-radius:10px; cursor:pointer;
  }
  .tabs button.on{ background:#0f1e33; color:#fff; box-shadow:0 4px 12px rgba(15,30,51,.18); }
  .card{
    background:#fff; border:1px solid #e5eaf1; border-radius:18px;
    box-shadow:0 6px 20px rgba(15,30,51,.08); padding:16px;
  }
  /* piano */
  #piano{
    position:relative; display:flex; height:230px; touch-action:none;
  }
  .wkey{
    flex:1; background:#fff; border:1px solid #dbe2ec; border-radius:0 0 10px 10px;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px;
    font-size:11px; font-weight:700; color:#94a3b8; cursor:pointer; position:relative; z-index:1;
  }
  .wkey + .wkey{ border-left:none; }
  .wkey.active{ background:#e0e7ff; }
  .wkey .c-dot{ position:absolute; bottom:26px; width:6px; height:6px; border-radius:50%; background:#c7d2fe; }
  .bkey{
    position:absolute; top:0; width:4.6%; height:58%; z-index:2;
    background:linear-gradient(#334155,#0f1e33); border-radius:0 0 7px 7px;
    transform:translateX(-50%); cursor:pointer;
    box-shadow:0 4px 8px rgba(15,30,51,.25);
  }
  .bkey.active{ background:linear-gradient(#6366f1,#4338ca); }
  /* drums */
  #drumGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; touch-action:none; }
  .pad{
    border:1px solid #e5eaf1; border-radius:16px; background:#f8fafc;
    padding:18px 6px; text-align:center; cursor:pointer;
    transition:transform .06s ease, background .06s ease;
    box-shadow:0 3px 10px rgba(15,30,51,.06);
  }
  .pad:active, .pad.active{ transform:scale(.93); background:#e0e7ff; border-color:#c7d2fe; }
  .pad .pn{ font-size:14px; font-weight:800; }
  .pad .pk{ font-size:11px; color:#64748b; font-weight:600; margin-top:2px; }
  /* recorder */
  .recbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rbtn{
    border:1px solid #e5eaf1; background:#fff; border-radius:12px;
    padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; color:#0f1e33;
    display:flex; align-items:center; gap:6px; box-shadow:0 3px 10px rgba(15,30,51,.06);
  }
  .rbtn:active{ transform:scale(.96); }
  .rbtn:disabled{ opacity:.4; }
  #recBtn.recording{ background:#fef2f2; border-color:#fecaca; color:#dc2626; }
  .dot{ width:10px; height:10px; border-radius:50%; background:#dc2626; display:inline-block; }
  .dot.blink{ animation:blink 1s infinite; }
  @keyframes blink{ 50%{ opacity:.2; } }
  #recStatus{ margin-left:auto; font-size:13px; color:#64748b; font-weight:600; }
  footer{ text-align:center; color:#94a3b8; font-size:12px; margin-top:4px; }
  footer b{ color:#6366f1; }
  .hint{ text-align:center; font-size:12px; color:#94a3b8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icon-192.png" alt="" width="34" height="34">
      <span class="brand-name">Music Tool</span>
    </div>
    <label class="vol">Vol <input type="range" id="vol" min="0" max="100" value="85"></label>
  </header>

  <div class="tabs">
    <button id="tabPiano" class="on">Piano</button>
    <button id="tabDrums">Drums</button>
  </div>

  <div class="card" id="viewPiano">
    <div id="piano"></div>
    <p class="hint">Tap or slide across the keys to play &middot; two octaves</p>
  </div>

  <div class="card" id="viewDrums" hidden>
    <div id="drumGrid"></div>
    <p class="hint">Tap the pads to play the beat</p>
  </div>

  <div class="card recbar">
    <button class="rbtn" id="recBtn"><span class="dot" id="recDot" hidden></span><span id="recLabel">Record</span></button>
    <button class="rbtn" id="playBtn" disabled>Play</button>
    <button class="rbtn" id="clearBtn" disabled>Clear</button>
    <button class="rbtn" id="tuneBtn">Surprise me</button>
    <button class="rbtn" id="stopBtn" disabled>Stop</button>
    <span id="recStatus"></span>
  </div>

  <footer>Made with <b>&hearts;</b> by sauravhhh</footer>
</div>
<script>
/* ================= audio engine (Web Audio, no files, offline) ================= */
const AU = (() => {
  let ctx = null, master = null, vol = 0.85;
  function ensure(){
    if (typeof window === 'undefined') return null;
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = vol;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function setVol(v){
    vol = v;
    if (master) master.gain.setTargetAtTime(v, ctx.currentTime, 0.02);
  }
  function adsrGain(t0, peak, dur){
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    return g;
  }
  function noiseBuf(dur){
    const len = Math.max(1, (dur * ctx.sampleRate) | 0);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function noiseHit(o){
    // o: {dur, v, type:'highpass'|'bandpass'|'lowpass', f, q, at}
    const t0 = ctx.currentTime + (o.at || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf(o.dur);
    const fl = ctx.createBiquadFilter();
    fl.type = o.type || 'highpass';
    fl.frequency.value = o.f || 6000;
    fl.Q.value = o.q || 0.8;
    const g = adsrGain(t0, o.v || 0.3, o.dur);
    src.connect(fl); fl.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + o.dur + 0.05);
  }
  function toneHit(o){
    // o: {f, slide, dur, v, type, at}
    const t0 = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + o.dur);
    const g = adsrGain(t0, o.v || 0.4, o.dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  }
  return {
    unlock(){ ensure(); },
    setVol,
    piano(freq){
      if (!ensure()) return;
      const t0 = ctx.currentTime;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 4200;
      lp.connect(master);
      const dur = Math.min(2.4, 110 / freq + 0.8);
      [[1, 'triangle', 0.50], [2, 'sine', 0.20], [3.01, 'sine', 0.07]].forEach(([m, ty, v]) => {
        const osc = ctx.createOscillator();
        osc.type = ty; osc.frequency.value = freq * m;
        const g = adsrGain(t0, v, dur);
        osc.connect(g); g.connect(lp);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      });
      // hammer click
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf(0.02);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
      const g = adsrGain(t0, 0.05, 0.02);
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(t0);
    },
    kick(){
      if (!ensure()) return;
      toneHit({ f: 160, slide: 48, dur: 0.28, v: 0.95 });
      noiseHit({ dur: 0.025, v: 0.25, f: 1200 });
    },
    snare(){
      if (!ensure()) return;
      noiseHit({ dur: 0.18, v: 0.5, type: 'bandpass', f: 1900, q: 0.9 });
      toneHit({ f: 195, dur: 0.11, v: 0.35 });
    },
    hat(open){
      if (!ensure()) return;
      noiseHit({ dur: open ? 0.4 : 0.055, v: 0.22, f: 7800 });
    },
    clap(){
      if (!ensure()) return;
      [0, 0.018, 0.036].forEach(a => noiseHit({ dur: 0.03, v: 0.35, type: 'bandpass', f: 1300, q: 1.4, at: a }));
      noiseHit({ dur: 0.22, v: 0.3, type: 'bandpass', f: 1300, q: 1.4, at: 0.055 });
    },
    tom(f){
      if (!ensure()) return;
      toneHit({ f, slide: f * 0.55, dur: 0.32, v: 0.7 });
    },
    cymbal(){
      if (!ensure()) return;
      noiseHit({ dur: 1.3, v: 0.26, f: 6200 });
      noiseHit({ dur: 0.9, v: 0.12, type: 'bandpass', f: 9200, q: 2 });
    },
    shaker(){
      if (!ensure()) return;
      noiseHit({ dur: 0.09, v: 0.2, f: 6500 });
    },
  };
})();

const freqOf = m => 440 * Math.pow(2, (m - 69) / 12);
const keyMap = {};

/* ================= playback engine (cancellable) ================= */
const Player = {
  timers: [], playing: false, label: '',
  clear(){ this.timers.forEach(clearTimeout); this.timers = []; },
  play(evs, label){
    this.stop();
    if (!evs.length) return;
    this.playing = true;
    this.label = label || 'Playing…';
    evs.forEach(ev => this.timers.push(setTimeout(() => {
      if (ev.kind === 'piano'){ AU.piano(freqOf(ev.id)); flashKey(ev.id); }
      else DRUMS[ev.id].fn();
    }, ev.t)));
    const last = evs[evs.length - 1].t;
    this.timers.push(setTimeout(() => this.finish(), last + 700));
    syncRecUI();
  },
  finish(){
    this.playing = false; this.label = ''; this.clear();
    syncRecUI();
  },
  stop(){
    if (!this.playing) return;
    this.playing = false; this.label = ''; this.clear();
    flashedKeys.splice(0).forEach(k => k.classList.remove('active'));
    syncRecUI();
  }
};

const flashedKeys = [];
function flashKey(m){
  const k = keyMap[m];
  if (!k) return;
  k.classList.add('active');
  flashedKeys.push(k);
  setTimeout(() => {
    k.classList.remove('active');
    const i = flashedKeys.indexOf(k);
    if (i >= 0) flashedKeys.splice(i, 1);
  }, 240);
}

/* ================= recorder ================= */
const REC = {
  on: false, t0: 0, evs: [], timer: null,
  start(){
    this.on = true; this.t0 = performance.now(); this.evs = [];
  },
  stop(){ this.on = false; },
  push(kind, id){
    if (!this.on) return;
    const t = performance.now() - this.t0;
    if (t > 60000) { this.stop(); syncRecUI(); return; }
    this.evs.push({ t, kind, id });
  },
  play(){
    if (!this.evs.length || Player.playing) return;
    Player.play(this.evs.slice(), 'Playing your recording…');
  },
};

function playSound(kind, id, fromPlayback){
  if (kind === 'piano') AU.piano(freqOf(id));
  else if (kind === 'drum') DRUMS[id].fn();
  if (!fromPlayback) REC.push(kind, id);
}

/* ================= piano ================= */
const pianoEl = document.getElementById('piano');
const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
(function buildPiano(){
  const start = 60, end = 83; // C4..B5
  const whites = [];
  for (let m = start; m <= end; m++){
    const name = NAMES[m % 12];
    const isBlack = name.includes('#');
    const key = document.createElement('div');
    key.className = isBlack ? 'bkey' : 'wkey';
    key.dataset.midi = m;
    keyMap[m] = key;
    if (!isBlack){
      const wi = whites.length;
      key.innerHTML = '<span>' + name + '</span>' + (name === 'C' ? '<span class="c-dot"></span>' : '');
      whites.push(m);
      if (isBlack) {} // placeholder
      key._wi = wi;
    } else {
      // position between neighboring white keys
      const wi = whites.length; // white key index to the left+1
      key.style.left = (wi * (100 / 14)) + '%';
    }
    const press = (e) => {
      if (e) e.preventDefault();
      AU.unlock();
      playSound('piano', m);
      key.classList.add('active');
    };
    const release = () => key.classList.remove('active');
    key.addEventListener('pointerdown', press);
    key.addEventListener('pointerup', release);
    key.addEventListener('pointercancel', release);
    key.addEventListener('pointerleave', release);
    key.addEventListener('pointerenter', (e) => { if (e.buttons > 0) press(null); });
    pianoEl.appendChild(key);
  }
})();

/* ================= drums ================= */
const DRUMS = [
  { name: 'Kick',    fn: () => AU.kick() },
  { name: 'Snare',   fn: () => AU.snare() },
  { name: 'Hat',     fn: () => AU.hat(false) },
  { name: 'OpenHat', fn: () => AU.hat(true) },
  { name: 'Clap',    fn: () => AU.clap() },
  { name: 'Tom Lo',  fn: () => AU.tom(150) },
  { name: 'Tom Hi',  fn: () => AU.tom(220) },
  { name: 'Cymbal',  fn: () => AU.cymbal() },
];
(function buildDrums(){
  const grid = document.getElementById('drumGrid');
  DRUMS.forEach((d, i) => {
    const pad = document.createElement('button');
    pad.className = 'pad';
    pad.innerHTML = '<div class="pn">' + d.name + '</div><div class="pk">pad ' + (i + 1) + '</div>';
    const hit = (e) => {
      if (e) e.preventDefault();
      AU.unlock();
      playSound('drum', i);
      pad.classList.add('active');
      setTimeout(() => pad.classList.remove('active'), 140);
    };
    pad.addEventListener('pointerdown', hit);
    grid.appendChild(pad);
  });
})();

/* ================= random tune composer ================= */
function randomTune(){
  AU.unlock();
  if (Player.playing || REC.on) return;
  // pick a random pentatonic scale and root so it always sounds good
  const scale = Math.random() < 0.5 ? [0, 2, 4, 7, 9] : [0, 3, 5, 7, 10];
  const root = 60 + [0, 2, 4, 5, 7][(Math.random() * 5) | 0];
  const notes = [];
  for (let oct = 0; oct < 2; oct++)
    scale.forEach(s => { const m = root + s + oct * 12; if (m <= 83) notes.push(m); });
  const beat = 280;
  const rhythms = [0.5, 0.5, 1, 0.5, 1, 1.5, 0.5, 2];
  const evs = [];
  let t = 200;
  let deg = (notes.length / 2) | 0;
  const count = 14 + ((Math.random() * 8) | 0);
  for (let i = 0; i < count; i++){
    deg += [-2, -1, -1, 1, 1, 2, 0][(Math.random() * 7) | 0];
    deg = Math.max(0, Math.min(notes.length - 1, deg));
    evs.push({ t, kind: 'piano', id: notes[deg] });
    if (Math.random() < 0.18 && notes[deg] + 12 <= 83) evs.push({ t, kind: 'piano', id: notes[deg] + 12 });
    t += rhythms[(Math.random() * rhythms.length) | 0] * beat;
  }
  // simple beat under it: kick on 1 and 3, snare on 2 and 4, hats on eighths
  const total = t + beat;
  for (let b = 0; (200 + b * beat) < total; b++){
    const bt = 200 + b * beat;
    if (b % 4 === 0 || b % 4 === 2) evs.push({ t: bt, kind: 'drum', id: 0 });
    if (b % 4 === 1 || b % 4 === 3) evs.push({ t: bt, kind: 'drum', id: 1 });
    evs.push({ t: bt, kind: 'drum', id: 2 });
    evs.push({ t: bt + beat / 2, kind: 'drum', id: 2 });
  }
  evs.sort((a, b) => a.t - b.t);
  Player.play(evs, 'Playing a random tune…');
}

/* ================= tabs ================= */
const tabPiano = document.getElementById('tabPiano');
const tabDrums = document.getElementById('tabDrums');
const viewPiano = document.getElementById('viewPiano');
const viewDrums = document.getElementById('viewDrums');
function showTab(which){
  const p = which === 'piano';
  tabPiano.classList.toggle('on', p);
  tabDrums.classList.toggle('on', !p);
  viewPiano.hidden = !p;
  viewDrums.hidden = p;
  AU.unlock();
}
tabPiano.addEventListener('click', () => showTab('piano'));
tabDrums.addEventListener('click', () => showTab('drums'));

/* ================= volume ================= */
document.getElementById('vol').addEventListener('input', (e) => {
  AU.unlock();
  AU.setVol(e.target.value / 100);
});

/* ================= recorder UI ================= */
const recBtn = document.getElementById('recBtn');
const playBtn = document.getElementById('playBtn');
const clearBtn = document.getElementById('clearBtn');
const tuneBtn = document.getElementById('tuneBtn');
const stopBtn = document.getElementById('stopBtn');
const recStatus = document.getElementById('recStatus');
const recDot = document.getElementById('recDot');
const recLabel = document.getElementById('recLabel');
function fmt(ms){
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function syncRecUI(){
  const playing = Player.playing;
  recBtn.disabled = playing;
  recBtn.classList.toggle('recording', REC.on);
  recDot.hidden = !REC.on;
  recDot.classList.toggle('blink', REC.on);
  recLabel.textContent = REC.on ? 'Stop' : 'Record';
  playBtn.disabled = REC.on || playing || REC.evs.length === 0;
  clearBtn.disabled = REC.on || playing || REC.evs.length === 0;
  tuneBtn.disabled = REC.on || playing;
  stopBtn.disabled = !playing;
  if (playing) recStatus.textContent = Player.label;
  else if (REC.on) recStatus.textContent = 'Recording… tap Stop when done';
  else if (REC.evs.length) recStatus.textContent = REC.evs.length + ' notes · ' + fmt(REC.evs[REC.evs.length - 1].t);
  else recStatus.textContent = '';
  if (REC.on && !REC.timer){
    const t0 = performance.now();
    REC.timer = setInterval(() => { recStatus.textContent = '● ' + fmt(performance.now() - t0); }, 500);
  }
  if (!REC.on && REC.timer){ clearInterval(REC.timer); REC.timer = null; }
}
recBtn.addEventListener('click', () => {
  AU.unlock();
  if (REC.on){ REC.stop(); } else { REC.start(); }
  syncRecUI();
});
playBtn.addEventListener('click', () => { AU.unlock(); REC.play(); });
clearBtn.addEventListener('click', () => { REC.evs = []; syncRecUI(); });
tuneBtn.addEventListener('click', randomTune);
stopBtn.addEventListener('click', () => Player.stop());
syncRecUI();

/* ================= service worker ================= */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
